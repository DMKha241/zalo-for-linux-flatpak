# Runtime dependencies shipped with x64 builds; all target libraries here are i386.
# Keep headers/compiler files in the private sysroot, separate from native app builds.
name: dependencies
only-arches:
- x86_64
buildsystem: simple
build-options:
  append-path: /app/toolchain/bin
cleanup:
- /lib/i386-linux-gnu/*.a
- /lib/i386-linux-gnu/*.la
- /lib/i386-linux-gnu/pkgconfig
build-commands:
- python3 patch-pipewire-camera.py src/pipewire
- bash setup-dependencies.sh
sources:
