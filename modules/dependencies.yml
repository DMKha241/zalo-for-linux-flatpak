  sha256: 8181172a1d95131f6af8bbc0b98f90b2a33349b042b84c3ce57dd5d11348cc58
  dest: src/pipewire
# Native x64 portal helper: request camera access and pass the authorized PipeWire FD to Wine32.
- type: file
  path: ../sources/camera-portal.c
# Patch the pinned PipeWire source; assertions fail if its connection implementation changes.
- type: file
  path: ../scripts/patch-pipewire-camera.py
# Cross-ABI IPC: spawn the native helper and receive its camera FD without a post-fork Wine deadlock.
- type: file
  path: ../sources/camera-remote.h
  dest: src/pipewire/pipewire-v4l2/src
# Let Wine stat /dev/videoN as a virtual character device, only after PipeWire can open that camera.
- type: file
  path: ../sources/camera-stat.h
  dest: src/pipewire/pipewire-v4l2/src
# Meson cross configuration: isolate pkg-config from native x64 libraries.
- type: inline
  dest-filename: i386.ini
  contents: |
    [binaries]
    c = 'i686-linux-gnu-gcc'
    cpp = 'i686-linux-gnu-g++'
    ar = 'i686-linux-gnu-ar'
    strip = 'i686-linux-gnu-strip'
    pkg-config = 'pkg-config'
    [properties]
    sys_root = '/app/toolchain/sysroot'
    pkg_config_libdir = ['/app/toolchain/sysroot/app/lib/i386-linux-gnu/pkgconfig', '/usr/share/pkgconfig']
    [host_machine]
    system = 'linux'
    cpu_family = 'x86'
    cpu = 'i686'
    endian = 'little'
# Build/stage runtime libraries in the private sysroot, then copy only runtime files into /app.
- type: inline
  dest-filename: setup-dependencies.sh
  contents: |
    #!/bin/bash
    set -euo pipefail
    src="$PWD/src"
    sysroot=/app/toolchain/sysroot
    jobs=${FLATPAK_BUILDER_N_JOBS:-2}
    logger=/app/toolchain/bin/build-logger
    export PATH="/app/toolchain/bin:$PATH"
    native_cflags=${CFLAGS:-}
    native_ldflags=${LDFLAGS:-}
    python_version=$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
    export PYTHONPATH="/app/toolchain/lib/python$python_version/site-packages${PYTHONPATH:+:$PYTHONPATH}"

    mkdir -p "$sysroot/usr/include"
    cp -a /usr/include/linux /usr/include/asm-generic \
      /usr/lib/x86_64-linux-gnu/include/asm "$sysroot/usr/include/"

    # Bootstrap GCC is now available; build the target libc before completing GCC.
    mkdir build-glibc
    cd build-glibc
    "$logger" configure.log env CFLAGS=-O2 "$src/glibc/configure" --prefix=/usr \
        --host=i686-linux-gnu --build="$("$src/glibc/scripts/config.guess")" \
        --with-headers="$sysroot/usr/include" --disable-werror
    "$logger" build.log make -j"$jobs"
    "$logger" install.log make install DESTDIR="$sysroot"
    cd ..
    bash /app/toolchain/setup-toolchain.sh finish-linux

    # Reuse architecture-independent SDK protocol headers and build generators.
    cp -a /usr/include/X11 /usr/include/GL "$sysroot/usr/include/"
    mkdir -p "$sysroot/usr/share"
    cp -a /usr/share/xcb "$sysroot/usr/share/"
    # xcb-proto.pc prefixes generator paths with pc_sysrootdir as well.
    python_pkg=$(python3 -c 'import xcbgen; print(xcbgen.__path__[0])')
    mkdir -p "$sysroot$(dirname "$python_pkg")"
    cp -a "$python_pkg" "$sysroot$(dirname "$python_pkg")/"
    export PKG_CONFIG_LIBDIR="$sysroot/app/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig"
    export PKG_CONFIG_SYSROOT_DIR="$sysroot"
    export CPPFLAGS="${CPPFLAGS:-} -I$sysroot/app/include"
    # Older C library sources predate GCC 16's default C23 dialect.
    # Append compatibility flags while preserving the SDK hardening options.
    export CFLAGS="${CFLAGS:--O2 -g} -std=gnu17"
    export CXXFLAGS="${CXXFLAGS:--O2 -g}"
    export LDFLAGS="${LDFLAGS:-} -L$sysroot/app/lib/i386-linux-gnu -Wl,-rpath-link,$sysroot/app/lib/i386-linux-gnu"

    auto() {
        local name=$1
        shift
        mkdir "build-$name"
        (
            cd "build-$name"
            # Supply glibc zero-size allocation results: malloc is non-NULL, realloc(ptr, 0) is NULL.
            "$logger" configure.log env ac_cv_func_malloc_0_nonnull=yes xorg_cv_malloc0_returns_null=yes "$src/$name/configure" --prefix=/app --libdir=/app/lib/i386-linux-gnu \
                --host=i686-linux-gnu --build="$(gcc -dumpmachine)" "$@"
            "$logger" build.log make -j"$jobs"
            "$logger" install.log make install DESTDIR="$sysroot"
            # Libtool archives contain unstaged /app paths; shared libraries do not need them.
            find "$sysroot/app/lib/i386-linux-gnu" -name '*.la' -delete
        )
    }
    meson_build() {
        local name=$1
        shift
        "$logger" "$name-configure.log" meson setup "build-$name" "$src/$name" --cross-file="$PWD/i386.ini" \
            --prefix=/app --libdir=lib/i386-linux-gnu --wrap-mode=nodownload \
            -Dauto_features=disabled "$@"
        "$logger" "$name-build.log" ninja -C "build-$name" -j"$jobs"
        "$logger" "$name-install.log" env DESTDIR="$sysroot" ninja -C "build-$name" install
    }

    mkdir build-zlib
    (
        cd build-zlib
        "$logger" configure.log env CHOST=i686-linux-gnu "$src/zlib/configure" --prefix=/app --libdir=/app/lib/i386-linux-gnu
        "$logger" build.log make -j"$jobs"
        "$logger" install.log make install DESTDIR="$sysroot"
    )
    auto expat --disable-static --without-docbook --without-examples --without-tests
    auto libpng --disable-static
    auto freetype --disable-static --without-bzip2 --without-brotli --without-harfbuzz
    auto fontconfig --disable-static --disable-docs --disable-cache-build
    auto gmp --disable-static --disable-cxx
    auto nettle --disable-static --disable-documentation
    auto libtasn1 --disable-static --disable-doc --disable-tools
    auto gnutls --disable-static --disable-doc --disable-tools --disable-tests \
        --disable-guile --without-p11-kit --without-idn --with-included-unistring \
        --without-brotli --without-zstd \
        --with-default-trust-store-dir=/etc/ssl/certs
    auto libsndfile --disable-static --disable-external-libs --disable-mpeg \
        --disable-programs --disable-examples --disable-regtest
    auto alsa --disable-static
    "$logger" jpeg-configure.log cmake -S "$src/jpeg" -B build-jpeg -G Ninja \
        -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=i686 \
        -DCMAKE_C_COMPILER=i686-linux-gnu-gcc -DCMAKE_SYSROOT="$sysroot" \
        -DCMAKE_INSTALL_PREFIX=/app -DCMAKE_INSTALL_LIBDIR=lib/i386-linux-gnu \
        -DENABLE_SHARED=ON -DENABLE_STATIC=OFF -DWITH_TURBOJPEG=OFF
    "$logger" jpeg-build.log ninja -C build-jpeg -j"$jobs"
    "$logger" jpeg-install.log env DESTDIR="$sysroot" ninja -C build-jpeg install
    meson_build v4l -Dv4l-utils=false -Dv4l-plugins=false -Dv4l-wrappers=false -Djpeg=enabled
    meson_build pulse -Ddaemon=false -Dclient=true -Ddoxygen=false -Dman=false -Dtests=false

    for name in Xau Xdmcp xcb X11 Xext Xrender Xfixes Xrandr Xcursor Xi Xinerama Xxf86vm Xcomposite; do
        auto "$name" --disable-static --disable-devel-docs --without-doxygen \
            --without-xmlto --without-fop
    done
    auto xshmfence --disable-static
    meson_build pciaccess -Dzlib=enabled
    meson_build drm -Dintel=enabled -Dnouveau=enabled -Dtests=false -Dman-pages=disabled
    ln -s zstd-root/build/meson "$src/zstd"
    meson_build zstd -Dbin_programs=false -Dbin_tests=false -Ddefault_library=shared
    # ponytail: no LLVM; Intel/AMD use softpipe, add LLVM and their drivers for acceleration.
    meson_build mesa -Dplatforms=x11 -Dgallium-drivers=nouveau,softpipe \
        -Dvulkan-drivers=[] -Dllvm=disabled -Dglvnd=disabled -Dglx=dri \
        -Degl=enabled -Dgbm=enabled -Dgles1=disabled -Dgles2=enabled \
        -Dvideo-codecs=[] -Dbuild-tests=false

    # Build the native portal helper with SDK libraries, then both V4L2 shims.
    native_pkg="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
    mkdir -p /app/bin
    "$logger" camera-portal.log gcc $native_cflags camera-portal.c $native_ldflags -o /app/bin/zalo-camera-portal \
        $(PKG_CONFIG_LIBDIR="$native_pkg" PKG_CONFIG_SYSROOT_DIR= pkg-config --cflags --libs gio-unix-2.0)
    "$logger" pipewire-native-configure.log env -u PKG_CONFIG_LIBDIR -u PKG_CONFIG_SYSROOT_DIR -u CPPFLAGS -u CFLAGS -u CXXFLAGS -u LDFLAGS \
        meson setup build-pw-native "$src/pipewire" --prefix=/app \
        -Dauto_features=disabled -Dpipewire-v4l2=enabled -Dpipewire-jack=disabled \
        -Dsession-managers=[] -Dtests=disabled -Dexamples=disabled -Dflatpak=disabled
    "$logger" pipewire-native-build.log ninja -C build-pw-native -j"$jobs" pipewire-v4l2/src/libpw-v4l2.so
    install -Dm755 build-pw-native/pipewire-v4l2/src/libpw-v4l2.so \
        /app/pw-v4l2/lib/x86_64-linux-gnu/libpw-v4l2.so
    # D-Bus/Camera permission runs in the native helper; PipeWire32 only uses its authorized FD.
    meson_build pipewire -Dpipewire-v4l2=enabled -Dpipewire-jack=disabled -Ddbus=disabled \
        -Dsession-managers=[] -Dtests=disabled -Dexamples=disabled -Dflatpak=disabled \
        -Dlibv4l2-path=/app/pw-v4l2/lib/i386-linux-gnu
    install -Dm755 "$sysroot/app/pw-v4l2/lib/i386-linux-gnu/libpw-v4l2.so" \
        /app/pw-v4l2/lib/i386-linux-gnu/libpw-v4l2.so
    # The locally built i386 glibc expands $LIB to lib.
    ln -s i386-linux-gnu/libpw-v4l2.so /app/pw-v4l2/lib/libpw-v4l2.so

    runtime=/app/lib/i386-linux-gnu
    mkdir -p "$runtime"
    cp -a "$sysroot/app/lib/i386-linux-gnu/." "$runtime/"
    for directory in "$sysroot/usr/lib" "$sysroot/lib" /app/toolchain/i686-linux-gnu/lib; do
        if test -d "$directory"; then
            find "$directory" -maxdepth 1 -name '*.so*' -exec cp -a -t "$runtime" {} +
        fi
    done
    if test -d "$sysroot/app/etc"; then
        mkdir -p /app/etc
        cp -a "$sysroot/app/etc/." /app/etc/
    fi
    if test -d "$sysroot/app/share"; then
        mkdir -p /app/share/locale
        find "$sysroot/app/share" -mindepth 1 -maxdepth 1 ! -name locale \
            -exec cp -a -t /app/share {} +
        # Flatpak's locale extension leaves per-language symlinks in /app/share/locale.
        for locale in "$sysroot/app/share/locale/"*; do
            test -d "$locale" || continue
            target="/app/share/locale/${locale##*/}"
            mkdir -p "$target"
            cp -a "$locale/." "$target/"
        done
    fi
    # Link and load the same bundled i386 libraries the bridge will use.
    cat > check.c <<'C'
    #include <X11/Xlib.h>
    #include <xcb/xcb.h>
    #include <dlfcn.h>
    #include <stdio.h>
    void *symbols[] = { (void *)XOpenDisplay, (void *)xcb_connect };
    int main(void) {
        const char *libs[] = { "libGL.so.1", "libEGL.so.1", "libpulse.so.0",
            "libasound.so.2", "libfontconfig.so.1", "libgnutls.so.30", "libv4l2.so.0" };
        for (unsigned i = 0; i < sizeof(libs) / sizeof(libs[0]); i++) {
            if (!dlopen(libs[i], RTLD_NOW)) {
                fprintf(stderr, "%s: %s\n", libs[i], dlerror());
                return 1;
            }
        }
        return !symbols[0] || !symbols[1];
    }
    C
    "$logger" check.log i686-linux-gnu-gcc $CPPFLAGS $LDFLAGS check.c -lX11 -lxcb -lXext -ldl -o check
