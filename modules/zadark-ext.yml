name: zadark-ext
buildsystem: simple
builddir: true

build-options:
  append-path: /usr/lib/sdk/node22/bin
  env:
    NPM_CONFIG_CACHE: /run/build/zadark-ext/flatpak-node/npm-cache
    NPM_CONFIG_NODEDIR: /usr/lib/sdk/node22

sources:
  - type: git
    url: https://github.com/VN-Linux-Family/zalo-for-linux.git
    commit: 125f7dc8de8e0757677ce88a702bb17c4603153d
  
  - type: file
    path: ../scripts/setup-zadark.sh
    dest: flatpak

  - type: file
    path: ../scripts/install-zadark.sh
    dest: flatpak

  # Node cache
  - ../sources/zadark/node_modules.json
  
  - type: file
    path: ../net.vietnamlinuxfamily.zalo_for_linux.ZaDark.metainfo.xml
    dest: flatpak

build-commands:
  - chmod +x ./flatpak/setup-zadark.sh
  - chmod +x ./flatpak/install-zadark.sh

  - ./flatpak/setup-zadark.sh
  - ./flatpak/install-zadark.sh 

