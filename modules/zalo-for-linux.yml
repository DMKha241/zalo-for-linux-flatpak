name: zalo-for-linux
buildsystem: simple
builddir: true

build-options:
  append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin
  env:
    NPM_CONFIG_CACHE: /run/build/zalo-for-linux/flatpak-node/npm-cache
    NPM_CONFIG_NODEDIR: /usr/lib/sdk/node22
    electron_config_cache: /run/build/zalo-for-linux/flatpak-node/electron-cache
    ELECTRON_CACHE: /run/build/zalo-for-linux/flatpak-node/electron-cache
    ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    CARGO_HOME: /run/build/zalo-for-linux/cargo
    CARGO_NET_OFFLINE: 'true'

sources:
  - type: git
    url: https://github.com/VN-Linux-Family/zalo-for-linux.git
    commit: a5c242fabd77326361c2780ca921eb1f38ade0af

  # Node & cargo cache
  - ../sources/node_modules.json
  - ../sources/cargo-crates.json

  - type: file
    path: ../scripts/setup-zalo-for-linux.sh
    dest: flatpak

  - type: file
    path: ../scripts/install-zalo-for-linux.sh
    dest: flatpak

  - type: file
    path: ../scripts/apply_extra.sh
    dest: flatpak

  - type: file
    path: ../bin/zalo
    dest: bin

  - type: file
    path: ../net.vietnamlinuxfamily.zalo_for_linux.metainfo.xml
    dest: flatpak

  - type: file
    path: ../net.vietnamlinuxfamily.zalo_for_linux.desktop
    dest: flatpak

  - type: file
    path: ../net.vietnamlinuxfamily.zalo_for_linux.svg
    dest: flatpak

  # Zalo macOS setup file
  - type: extra-data
    url: https://res-download-pc.zadn.vn/mac/ZaloSetup-universal-26.11.10.dmg
    sha256: eff7e9c887a1164ae078e919f950b5552ffc3d846f8a63bd12ce88171ba79092
    size: 339743085
    filename: ZaloSetup-universal-26.11.10.dmg

  # Zalo Windows setup file (for ocr models)
  - type: extra-data
    url: https://res-download-pc.zadn.vn/win/ZaloSetup-26.11.10.exe
    sha256: 7166ea28925b3121369ffb25e87b4749a648f47a861272009dcb14094b5a5511
    size: 213369880
    filename: ZaloSetup-26.11.10.exe

build-commands:
  - chmod +x ./flatpak/setup-zalo-for-linux.sh
  - chmod +x ./flatpak/install-zalo-for-linux.sh

  - ./flatpak/setup-zalo-for-linux.sh
  - ./flatpak/install-zalo-for-linux.sh
