name: zalo-for-linux
buildsystem: simple
builddir: true

build-options:
  append-path: /usr/lib/sdk/node22/bin:/usr/lib/sdk/rust-stable/bin
  env:
    NPM_CONFIG_CACHE: /run/build/zalo-for-linux/flatpak-node/npm-cache
    NPM_CONFIG_NODEDIR: /usr/lib/sdk/node22
    electron_config_cache: /run/build/zalo-for-linux/flatpak-node/electron-cache
    ELECTRON_CACHE: /run/build/zalo-for-linux/flatpak-node/electron-cache
    ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    CARGO_HOME: /run/build/zalo-for-linux/cargo
    CARGO_NET_OFFLINE: 'true'
  arch:
    x86_64:
      append-path: /app/toolchain/bin

sources:
  - type: git
    url: https://github.com/VN-Linux-Family/zalo-for-linux.git
    commit: 12ef36d227e450f4271d26d0b189e64203726e20
    x-checker-data:
      type: json
      url: https://api.github.com/repos/VN-Linux-Family/zalo-for-linux/commits?sha=main&per_page=1
      commit-query: .[0].sha
      timestamp-query: .[0].commit.committer.date

  # Node & cargo cache
  - ../sources/node_modules.json
  - ../sources/gyp-node_modules.json
  - ../sources/cargo-crates.json

  # Zalo macOS setup file
  - type: file
    url: https://res-download-pc.zadn.vn/mac/ZaloSetup-universal-26.10.20.dmg
    sha256: a45d30b7f7b060f76b87722ef419b8f41d23a2913cdef084dcb0955dde8d85a0
    dest: temp
    x-checker-data:
      type: json
      url: https://formulae.brew.sh/api/cask/zalo.json
      version-query: .version
      url-query: .url

  # Zalo Windows setup file (for ocr models and call)
  - type: file
    url: https://res-download-pc.zadn.vn/win/ZaloSetup-26.10.20.exe
    sha256: 8f2ee2c549c2b99e5acbe6af0063856a6b412331b23c23a5b8f2601ac20f99b7
    dest: temp
    x-checker-data:
      type: json
      url: https://formulae.brew.sh/api/cask/zalo.json
      version-query: .version
      url-query: '"https://res-download-pc.zadn.vn/win/ZaloSetup-" + $version + ".exe"'

  # Native CPU OCR runtime (ONNX Runtime 1.30.0)
  - type: archive
    url: https://github.com/microsoft/onnxruntime/archive/refs/tags/v1.30.0.tar.gz
    sha256: f6681ecbddf53898adf0cc9e8e9e84657485b84d2eca3c8aa353de6d7dd417ef
    dest: flatpak-onnxruntime

  - ../sources/onnxruntime-deps.json

  - type: file
    path: ../scripts/setup-onnxruntime.sh
    dest: flatpak

  - type: file
    path: ../scripts/build-logger.sh
    dest: flatpak

  - type: file
    path: ../net.vietnamlinuxfamily.zalo_for_linux.desktop
    dest: flatpak

  - type: file
    path: ../net.vietnamlinuxfamily.zalo_for_linux.metainfo.xml
    dest: flatpak

  - type: file
    path: ../scripts/setup-zalo-for-linux.sh
    dest: flatpak

  - type: file
    path: ../scripts/install-zalo-for-linux.sh
    dest: flatpak

build-commands:
  - chmod +x ./flatpak/build-logger.sh
  - chmod +x ./flatpak/setup-onnxruntime.sh
  - sh ./flatpak/setup-onnxruntime.sh
  - chmod +x ./flatpak/setup-zalo-for-linux.sh
  - chmod +x ./flatpak/install-zalo-for-linux.sh
  - ./flatpak/setup-zalo-for-linux.sh
  - ./flatpak/install-zalo-for-linux.sh
