name: 7z
buildsystem: simple

sources:
  - type: archive
    url: https://github.com/ip7z/7zip/releases/download/26.03/7z2603-src.tar.xz
    sha256: 9cbde5099c6deb73691b0579063da5827522ccbbcba3f0020fd04e8c8c16c0d4
    strip-components: 0
  - type: file
    path: ../scripts/build-logger.sh

build-commands:
  - bash ./build-logger.sh 7z-build.log make -C CPP/7zip/Bundles/Alone2 -f ../../cmpl_gcc.mak -j${FLATPAK_BUILDER_N_JOBS} CXX_WARN_FLAGS=-Wno-error=array-bounds
  - install -Dm0755 CPP/7zip/Bundles/Alone2/b/g/7zz /app/bin/7z
