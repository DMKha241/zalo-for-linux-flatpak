name: wine
only-arches:
- x86_64
buildsystem: simple
build-commands:
- tar -xJf wine-11.14-amd64.tar.xz --strip-components=1 -C /app
- /app/toolchain/bin/patchelf --set-interpreter /app/lib/i386-linux-gnu/ld-linux.so.2
  /app/lib/wine/i386-unix/wine
- install -Dm644 ld.so.conf /app/etc/ld.so.conf
- sed -i '/^exec /i export LD_PRELOAD="/app/pw-v4l2/\\$LIB/libpw-v4l2.so${LD_PRELOAD:+:$LD_PRELOAD}"'
  /app/bin/zalo
sources:
- type: file
  url: https://github.com/Kron4ek/Wine-Builds/releases/download/11.14/wine-11.14-amd64.tar.xz
  sha256: 0c1082b9c1b2ab0a85645ed3c83191dd60b557b28169733546d81fe599ad88b3
- type: inline
  dest-filename: ld.so.conf
  contents: |
    /app/lib
    /app/lib32
    /app/lib/i386-linux-gnu
