name: wine
only-arches:
  - x86_64
buildsystem: simple
build-commands:
  - tar -xJf wine-11.14-amd64.tar.xz --strip-components=1 -C /app
  - mkdir -p /app/lib/i386-linux-gnu/GL
  - install -Dm644 ld.so.conf /app/etc/ld.so.conf
  # Apply preload to Zalo and its children only when this x64 module is built.
  - >-
    sed -i '/^exec /i export LD_PRELOAD="/app/pw-v4l2/\\$LIB/libpw-v4l2.so${LD_PRELOAD:+:$LD_PRELOAD}"' /app/bin/zalo
sources:
  - type: file
    url: https://github.com/Kron4ek/Wine-Builds/releases/download/11.14/wine-11.14-amd64.tar.xz
    sha256: 0c1082b9c1b2ab0a85645ed3c83191dd60b557b28169733546d81fe599ad88b3
  - type: inline
    dest-filename: ld.so.conf
    contents: |
      /app/lib
      /app/lib32
      /app/lib/i386-linux-gnu
modules:
  - name: pw-v4l2
    buildsystem: simple
    build-commands:
      - meson setup _build -Dauto_features=disabled -Dpipewire-v4l2=enabled -Dpipewire-jack=disabled -Dsession-managers=[] -Dtests=disabled -Dexamples=disabled
      - ninja -C _build pipewire-v4l2/src/libpw-v4l2.so
      - install -Dm755 _build/pipewire-v4l2/src/libpw-v4l2.so /app/pw-v4l2/lib/$(uname -m)-linux-gnu/libpw-v4l2.so
    sources:
      - &pipewire-source
        type: archive
        url: https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/1.6.8/pipewire-1.6.8.tar.gz
        sha256: 8181172a1d95131f6af8bbc0b98f90b2a33349b042b84c3ce57dd5d11348cc58
  - name: pw-v4l2-i386
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/toolchain-i386/bin
      env:
        PKG_CONFIG_LIBDIR: /usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig
    build-commands:
      - meson setup _build --cross-file=i386.ini -Dauto_features=disabled -Dpipewire-v4l2=enabled -Dpipewire-jack=disabled -Dsession-managers=[] -Dtests=disabled -Dexamples=disabled
      - ninja -C _build pipewire-v4l2/src/libpw-v4l2.so
      - install -Dm755 _build/pipewire-v4l2/src/libpw-v4l2.so /app/pw-v4l2/lib/i386-linux-gnu/libpw-v4l2.so
    sources:
      - *pipewire-source
      - type: inline
        dest-filename: i386.ini
        contents: |
          [binaries]
          c = 'i686-unknown-linux-gnu-gcc'
          cpp = 'i686-unknown-linux-gnu-g++'
          ar = 'i386-linux-gnu-ar'
          strip = 'i386-linux-gnu-strip'
          pkg-config = 'pkg-config'
          [host_machine]
          system = 'linux'
          cpu_family = 'x86'
          cpu = 'i686'
          endian = 'little'
