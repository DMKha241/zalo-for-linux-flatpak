name: onnxruntime
buildsystem: simple

sources:
  # Native CPU OCR runtime (ONNX Runtime 1.30.0)
  - type: git
    url: https://github.com/intel/onnxruntime.git
    commit: f2c39fe2f838cf35ce7da92824f5a5e3ee6e88a7 # This is the latest commit of v1.30.0, which is declared in the Content types of .nupkg version 
    dest: onnxruntime

  - ../sources/onnxruntime-deps.json

  - type: file
    path: ../scripts/build-logger.sh

  - type: file
    path: ../scripts/setup-onnxruntime.sh

  - type: file
    path: ../scripts/verify-onnxruntime.py

build-commands:
  - chmod +x ./build-logger.sh
  - chmod +x ./setup-onnxruntime.sh

  - ./setup-onnxruntime.sh
