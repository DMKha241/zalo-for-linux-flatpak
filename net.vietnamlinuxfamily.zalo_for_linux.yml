id: net.vietnamlinuxfamily.zalo-for-linux

runtime: org.freedesktop.Platform
runtime-version: '26.08'

base: org.electronjs.Electron2.BaseApp
base-version: '26.08'

sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable

add-extensions:
  net.vietnamlinuxfamily.zalo-for-linux.Extension:

command: zalo

finish-args:
    - --share=network
    - --share=ipc
    - --device=dri
    - --socket=wayland
    - --socket=fallback-x11
    - --socket=pulseaudio
    - --filesystem=xdg-download
    - --talk-name=org.kde.StatusNotifierWatcher
    - --talk-name=org.kde.Spectacle
    - --own-name=org.kde.StatusNotifierItem-net.vietnamlinuxfamily.zalo_for_linux # Electron 22 tray icon & tray menu
    - --talk-name=com.canonical.AppMenu.Registrar
    - --talk-name=com.canonical.indicator.application
    - --talk-name=org.ayatana.indicator.application

modules:
  - modules/7z.yml
  - modules/zalo-for-linux.yml
  - modules/cleanup.yml
