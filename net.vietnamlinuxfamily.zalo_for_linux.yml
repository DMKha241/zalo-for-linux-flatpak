id: net.vietnamlinuxfamily.zalo_for_linux

runtime: org.freedesktop.Platform
runtime-version: '26.08'

base: org.electronjs.Electron2.BaseApp
base-version: '26.08'

sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
  - org.freedesktop.Sdk.Extension.rust-stable

command: zalo

finish-args:
    - --share=network
    - --share=ipc
    - --device=all # Camera
    - --socket=x11 # Electron 22 need run with X11/Xwayland
    - --socket=pulseaudio
    - --filesystem=xdg-download
    - --filesystem=xdg-pictures
    - --talk-name=org.freedesktop.Notifications
    - --talk-name=org.kde.StatusNotifierWatcher
    - --talk-name=org.kde.Spectacle
    - --own-name=org.kde.StatusNotifierItem-2-1
    - --talk-name=com.canonical.AppMenu.Registrar
    - --talk-name=com.canonical.indicator.application
    - --talk-name=org.ayatana.indicator.application
    - --talk-name=org.freedesktop.impl.portal.PermissionStore

modules:
  - modules/7z.yml
  - modules/onnxruntime.yml
  - modules/zalo-for-linux.yml

