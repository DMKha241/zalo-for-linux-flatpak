
name: Check for upstream updates

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-updates
  cancel-in-progress: false

jobs:
  update-sources:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Upstream updates
        uses: docker://ghcr.io/flathub-infra/flatpak-external-data-checker:latest
        with:
          args: --update net.vietnamlinuxfamily.zalo_for_linux.yml
