name: Refresh generated Flatpak sources

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Resolve pinned upstream commit
        id: resolve
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder jq python3-venv
          flatpak-builder --show-manifest net.vietnamlinuxfamily.zalo_for_linux.yml > "$RUNNER_TEMP/manifest.json"
          commit=$(jq -er '.modules[] | select(.name == "zalo-for-linux") | .sources[] | select(.type == "git" and .url == "https://github.com/VN-Linux-Family/zalo-for-linux.git") | .commit' "$RUNNER_TEMP/manifest.json")
          echo "upstream-commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: VN-Linux-Family/zalo-for-linux
          ref: ${{ steps.resolve.outputs.upstream-commit }}
          path: upstream
          submodules: recursive
          persist-credentials: false

      - name: Install source generators
        run: |
          git clone --depth 1 https://github.com/flatpak/flatpak-builder-tools.git "$RUNNER_TEMP/flatpak-builder-tools"
          python3 -m venv "$RUNNER_TEMP/source-tools"
          "$RUNNER_TEMP/source-tools/bin/pip" install tomlkit aiohttp "$RUNNER_TEMP/flatpak-builder-tools/node"

      - name: Regenerate Cargo, Node, and GYP sources
        env:
          CARGO_GENERATOR: ${{ runner.temp }}/flatpak-builder-tools/cargo/flatpak-cargo-generator.py
        run: |
          PATH="$RUNNER_TEMP/source-tools/bin:$PATH" sh scripts/generate-flatpak-sources.sh "$GITHUB_WORKSPACE/upstream" sources

      - name: Detect generated changes
        id: diff
        run: |
          if git diff --quiet -- sources/node_modules.json sources/gyp-node_modules.json sources/cargo-crates.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: generated-sources
          path: |
            sources/node_modules.json
            sources/gyp-node_modules.json
            sources/cargo-crates.json
          if-no-files-found: error

  update-pr:
    needs: generate
    # shortcut: fork PR branches are not writable with the base repo token; use a maintainer branch if that changes.
    if: needs.generate.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: generated-sources
          path: sources

      - name: Commit generated sources to the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          for file in sources/node_modules.json sources/gyp-node_modules.json sources/cargo-crates.json; do
            jq -e 'type == "array"' "$file" >/dev/null
            size=$(wc -c < "$file")
            test "$size" -le 5000000
          done

          current_head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)
          test "$current_head" = "$PR_HEAD" || { echo 'PR changed during generation; retry on its next synchronize event.' >&2; exit 1; }

          jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$PR_BRANCH" --arg head "$PR_HEAD" \
            --rawfile node sources/node_modules.json \
            --rawfile gyp sources/gyp-node_modules.json \
            --rawfile cargo sources/cargo-crates.json '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid signature { isValid wasSignedByGitHub } } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: "Refresh generated Flatpak sources"},
                fileChanges: {additions: [
                  {path: "sources/node_modules.json", contents: ($node | @base64)},
                  {path: "sources/gyp-node_modules.json", contents: ($gyp | @base64)},
                  {path: "sources/cargo-crates.json", contents: ($cargo | @base64)}
                ]}
              }}
            }' > "$RUNNER_TEMP/source-commit.json"

          gh api graphql --method POST --input "$RUNNER_TEMP/source-commit.json" > "$RUNNER_TEMP/source-result.json"
          jq -e '.data.createCommitOnBranch.commit.signature | .isValid and .wasSignedByGitHub' \
            "$RUNNER_TEMP/source-result.json" >/dev/null
