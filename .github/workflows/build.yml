name: Build Zalo Flatpak

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    outputs:
      zalo-version: ${{ steps.metadata.outputs.version }}
      release-version: ${{ steps.metadata.outputs.release_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            artifact-arch: x64
            runner: ubuntu-24.04
          - arch: aarch64
            artifact-arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.arch }}
      cancel-in-progress: true
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    env:
      FLATPAK_ARCH: ${{ matrix.arch }}
      ARTIFACT_ARCH: ${{ matrix.artifact-arch }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine artifact name and tag from metainfo.xml
        id: metadata
        run: |
          full_version=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("net.vietnamlinuxfamily.zalo_for_linux.metainfo.xml").find("./releases/release").attrib["version"])')
          [[ -n "$full_version" && "$full_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(.[0-9A-Za-z._-]+)?$ ]]

          tag_version=$(echo "$full_version" | cut -d'.' -f1-3)
          [[ "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          
          artifact="Zalo-${full_version}-${ARTIFACT_ARCH}.flatpak"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "release_version=$full_version" >> "$GITHUB_OUTPUT"

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: ${{ steps.metadata.outputs.artifact }}
          manifest-path: net.vietnamlinuxfamily.zalo_for_linux.yml
          arch: ${{ matrix.arch }}
          branch: master
          build-dir: build-dir-zalo
          keep-build-dirs: false
          cache: true
          restore-cache: true
          save-cache: true
          cache-key: flatpak-${{ hashFiles('net.vietnamlinuxfamily.zalo_for_linux.yml', 'net.vietnamlinuxfamily.zalo_for_linux.metainfo.xml', 'modules/*.yml', 'scripts/*.sh', 'sources/*.json') }}
          upload-artifact: false

      - name: Package local build cache
        shell: bash
        run: |
          set -euo pipefail
          cache_archive="$RUNNER_TEMP/flatpak-build-cache-${FLATPAK_ARCH}.tar.gz"
          test -d .flatpak-builder
          tar -czf "$cache_archive" \
            --exclude='*/.lock' \
            --exclude='*/rofiles-*' \
            .flatpak-builder
          echo "Cache archive: $(du -h "$cache_archive" | cut -f1)"

      - name: Upload downloadable build cache
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-build-cache-${{ matrix.arch }}
          path: ${{ runner.temp }}/flatpak-build-cache-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload Flatpak repository
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo-${{ matrix.arch }}
          path: repo/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact }}
          path: ${{ steps.metadata.outputs.artifact }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: zalo-release-${{ needs.build.outputs.zalo-version }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ZALO_VERSION: ${{ needs.build.outputs.zalo-version }}
      RELEASE_VERSION: ${{ needs.build.outputs.release-version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Zalo-*.flatpak
          merge-multiple: true
          path: dist

      - name: Publish release
        run: |
          files=(dist/Zalo-*.flatpak)
          [[ ${#files[@]} -eq 2 ]]
          for file in "${files[@]}"; do test -s "$file"; done

          if ! gh release view "$ZALO_VERSION" >/dev/null 2>&1; then
            gh release create "$ZALO_VERSION" --target "$GITHUB_SHA" --title "Zalo $ZALO_VERSION" --notes "Release $RELEASE_VERSION (Flatpak builds for x64 and aarch64)."
          else
            gh release edit "$ZALO_VERSION" --target "$GITHUB_SHA" --title "Zalo $ZALO_VERSION" --notes "Release $RELEASE_VERSION (Flatpak builds for x64 and aarch64)."
          fi

          gh api "repos/$GH_REPO/releases/tags/$ZALO_VERSION" > release.json
          declare -A keep=()
          while IFS= read -r name; do
            [[ "$name" == Zalo-*.flatpak && "$name" != */* ]] || continue
            if [[ -f "dist/$name" ]]; then
              local_sha=$(sha256sum "dist/$name" | cut -d ' ' -f1)
              digest=$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest // ""' release.json)
              if [[ "$digest" != sha256:* ]]; then
                mkdir -p previous
                gh release download "$ZALO_VERSION" --pattern "$name" --dir previous
                digest="sha256:$(sha256sum "previous/$name" | cut -d ' ' -f1)"
              fi
              if [[ "$digest" == "sha256:$local_sha" ]]; then
                keep["$name"]=1
                echo "Unchanged: $name"
                continue
              fi
            fi
            gh release delete-asset "$ZALO_VERSION" "$name" --yes
          done < <(jq -r '.assets[].name // empty' release.json)

          for file in "${files[@]}"; do
            name=$(basename "$file")
            if [[ -z "${keep[$name]:-}" ]]; then
              gh release upload "$ZALO_VERSION" "$file" --clobber
            fi
          done
    
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download x86_64 Flatpak repository
        uses: actions/download-artifact@v4
        with:
          name: flatpak-repo-x86_64
          path: repo

      - name: Prepare x86_64 Flatpak repository
        shell: bash
        run: |
          set -euo pipefail

          # OSTree expects all refs namespaces to exist, including empty ones.
          mkdir -p repo/refs/heads repo/refs/remotes repo/refs/mirrors

          # Debug extensions are not needed by end users. Remove both the
          # app's debug symbols and any matching runtime debug extension.
          ostree refs --repo=repo --delete \
            app/net.vietnamlinuxfamily.zalo_for_linux.Debug
          ostree refs --repo=repo --delete \
            runtime/net.vietnamlinuxfamily.zalo_for_linux.Debug

          # Keep only commits directly referenced by current refs; do not
          # retain their parent history, so Pages contains the latest version only.
          flatpak build-update-repo --prune --prune-depth=0 repo

          # GitHub Pages currently publishes the x86_64 remote only.
          app_ref=app/net.vietnamlinuxfamily.zalo_for_linux/x86_64/master
          refs=$(ostree refs --repo=repo)
          grep -Fxq "$app_ref" <<< "$refs"
          commit_count=$(ostree log --repo=repo "$app_ref" | awk '/^commit / { count++ } END { print count+0 }')
          if [[ "$commit_count" -ne 1 ]]; then
            echo "::error::Expected only the latest app commit, found $commit_count commits."
            exit 1
          fi

          # Verify that the merged repository is actually consumable by Flatpak.
          flatpak remote-add --user --no-gpg-verify zalo-pages-check repo
          flatpak remote-ls --user --app zalo-pages-check | grep -Fq \
            net.vietnamlinuxfamily.zalo_for_linux
          flatpak remote-delete --user --force zalo-pages-check

          echo "Merged repository size:"
          du -sh repo
          du -sb repo

          # A Flatpak repository has no HTML landing page by default. Publish
          # one so opening the Pages URL does not show GitHub Pages' 404 page.
          cat > repo/index.html <<'HTML'
                    <!doctype html>
                    <html lang="en">
                    <head>
                      <meta charset="utf-8">
                      <meta name="viewport" content="width=device-width, initial-scale=1">
                      <title>Zalo for Linux — Flatpak Repository</title>
                      <style>
                        :root { color-scheme: light dark; font: 16px/1.6 system-ui, sans-serif; }
                        body { max-width: 760px; margin: 8vh auto; padding: 0 24px; }
                        main { border: 1px solid color-mix(in srgb, currentColor 18%, transparent); border-radius: 16px; padding: 28px; }
                        h1 { margin-top: 0; }
                        code { overflow-wrap: anywhere; }
                        a { color: #3584e4; }
                        .install { display: inline-block; margin: 12px 0; padding: 10px 16px; border-radius: 8px; background: #3584e4; color: white; text-decoration: none; }
                      </style>
                    </head>
                    <body>
                      <main>
                        <h1>Zalo for Linux</h1>
                        <p>Unofficial Zalo desktop client for Linux, distributed as a Flatpak.</p>
                        <p><a class="install" href="zalo.flatpakrepo">Add Flatpak repository</a></p>
                        <h2>Install</h2>
                        <p>Add this repository, then install the application:</p>
                        <pre><code>flatpak remote-add --user --no-gpg-verify zalo https://dmkha241.github.io/zalo-for-linux-flatpak
          flatpak install --user zalo net.vietnamlinuxfamily.zalo_for_linux</code></pre>
                        <p>Supported architecture on this repository: x86_64.</p>
                        <p><a href="https://github.com/DMKha241/zalo-for-linux-flatpak">Source and issue tracker</a></p>
                      </main>
                    </body>
                    </html>
          HTML

          cat > repo/zalo.flatpakrepo <<'REPO'
                    [Flatpak Repo]
                    Title=Zalo for Linux
                    Url=https://dmkha241.github.io/zalo-for-linux-flatpak
                    Homepage=https://github.com/VN-Linux-Family/zalo-for-linux
                    Comment=Unofficial Zalo desktop client for Linux
                    Description=Zalo for Linux Flatpak repository
          REPO

          # Keep the deployment within GitHub Pages' supported size.
          repo_size=$(du -sb repo | cut -f1)
          if (( repo_size >= 1000000000 )); then
            echo "::error::Flatpak repository is ${repo_size} bytes; GitHub Pages supports at most 1 GB."
            exit 1
          fi

      - name: Prepare Pages artifact
        run: touch repo/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-24.04

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    
