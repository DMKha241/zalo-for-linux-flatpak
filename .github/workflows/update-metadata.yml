name: Update AppStream metadata

on:
  pull_request_target:
    branches:
      - main
    types:
      - closed

permissions:
  contents: write
  actions: write

jobs:
  update:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update release version and build
        env:
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -nE 's#.*ZaloSetup-universal-([0-9]+\.[0-9]+\.[0-9]+)\.dmg.*#\1#p' modules/zalo-for-linux.yml | head -n1)
          test -n "$version"
          timestamp=$(date -u -d "$MERGED_AT" +%y%m%d%H%M%S)
          RELEASE_TAG="${version}.${timestamp}" python3 scripts/update-release-version.py

          if ! git diff --quiet -- net.vietnamlinuxfamily.zalo_for_linux.metainfo.xml; then
            file=net.vietnamlinuxfamily.zalo_for_linux.metainfo.xml
            head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
            jq -n --arg repo "$GITHUB_REPOSITORY" --arg head "$head" \
              --arg message "Update AppStream metadata to ${version}.${timestamp}" \
              --arg content_path "$file" --rawfile content "$file" '{
                query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid signature { isValid wasSignedByGitHub } } } }",
                variables: {input: {
                  branch: {repositoryNameWithOwner: $repo, branchName: "main"},
                  expectedHeadOid: $head,
                  message: {headline: $message},
                  fileChanges: {additions: [{path: $content_path, contents: ($content | @base64)}]}
                }}
              }' > "$RUNNER_TEMP/metadata-commit.json"
            gh api graphql --method POST --input "$RUNNER_TEMP/metadata-commit.json" > "$RUNNER_TEMP/metadata-result.json"
            jq -e '.data.createCommitOnBranch.commit.signature | .isValid and .wasSignedByGitHub' \
              "$RUNNER_TEMP/metadata-result.json" >/dev/null
          fi

          gh workflow run build.yml --ref main
