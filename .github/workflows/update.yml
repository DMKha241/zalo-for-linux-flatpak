name: Check for updates

on:
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run update check
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update.py

      - name: Push update branch
        if: steps.update.outputs.has_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${{ steps.update.outputs.release_version }}"
          git add -A
          git commit -m "Update to ${{ steps.update.outputs.release_version }}"
          git push -u origin "${{ steps.update.outputs.release_version }}"

      - name: Checkout upstream
        if: steps.update.outputs.commit_changed == 'true'
        uses: actions/checkout@v4
        with:
          repository: VN-Linux-Family/zalo-for-linux
          ref: ${{ steps.update.outputs.upstream_commit }}
          path: upstream

      - name: Install Flatpak generators
        if: steps.update.outputs.commit_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          pipx install "git+https://github.com/flatpak/flatpak-builder-tools.git#subdirectory=node"

          GENERATOR_DIR="$RUNNER_TEMP/cargo-generator"
          VENV="$GENERATOR_DIR/venv"

          mkdir -p "$GENERATOR_DIR"

          curl -fL https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py \
            -o "$GENERATOR_DIR/flatpak-cargo-generator.py"

          python3 -m venv "$VENV"

          "$VENV/bin/pip" install \
            "aiohttp>=3.9.5,<4.0.0" \
            "PyYAML>=6.0.2,<7.0.0" \
            "tomlkit>=0.13.3,<1.0"

          cat > "$GENERATOR_DIR/flatpak-cargo-generator" <<EOF
          #!/bin/sh
          exec "$VENV/bin/python" "$GENERATOR_DIR/flatpak-cargo-generator.py" "\$@"
          EOF

          chmod +x "$GENERATOR_DIR/flatpak-cargo-generator"

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "CARGO_GENERATOR=$GENERATOR_DIR/flatpak-cargo-generator" >> "$GITHUB_ENV"

          flatpak-node-generator -h
          "$GENERATOR_DIR/flatpak-cargo-generator" -h

      - name: Generate flatpak sources
        if: steps.update.outputs.commit_changed == 'true'
        run: |
          rm -f sources/cargo-crates.json \
                sources/node_modules.json \
                sources/gyp-node_modules

          sh scripts/generate-flatpak-sources.sh upstream sources

      - name: Push generated sources
        if: steps.update.outputs.commit_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A -- sources/

          if ! git diff --cached --quiet; then
            git commit -m "Generate flatpak sources"
            git push
          fi

      - name: Prepare PR body
        if: steps.update.outputs.has_update == 'true'
        id: pr
        env:
          VERSION_CHANGED: ${{ steps.update.outputs.version_changed }}
          COMMIT_CHANGED: ${{ steps.update.outputs.commit_changed }}
          UPSTREAM_VERSION: ${{ steps.update.outputs.upstream_version }}
          CURRENT_COMMIT: ${{ steps.update.outputs.current_commit }}
          UPSTREAM_COMMIT: ${{ steps.update.outputs.upstream_commit }}
          COMMIT_MESSAGES: ${{ steps.update.outputs.commit_messages }}
        run: |
          BODY="Automated update"

          if [ "$VERSION_CHANGED" = "true" ]; then
            BODY="${BODY}
          Update Zalo to $UPSTREAM_VERSION"
          fi

          if [ "$COMMIT_CHANGED" = "true" ]; then
            BODY="${BODY}
          Commit update: ${CURRENT_COMMIT:0:7} → ${UPSTREAM_COMMIT:0:7}"
          fi

          if [ -n "$COMMIT_MESSAGES" ]; then
            CHANGELOG=""

            while IFS= read -r line; do
              [ -n "$line" ] && CHANGELOG="${CHANGELOG}
          - ${line}"
            done <<< "$COMMIT_MESSAGES"

            if [ -n "$CHANGELOG" ]; then
              BODY="${BODY}

          Changelog:${CHANGELOG}

          Full changelog: [here](https://github.com/VN-Linux-Family/zalo-for-linux/compare/${CURRENT_COMMIT}...${UPSTREAM_COMMIT})"
            fi
          fi

          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.update.outputs.has_update == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: "${{ steps.update.outputs.release_version }}"
          title: "Update to ${{ steps.update.outputs.release_version }}"
          body: ${{ steps.pr.outputs.body }}
          base: main
